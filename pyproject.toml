[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-github-plus-mcp"
version = "0.1.0"
description = "MCP server exposing GitHub (github.com and GitHub Enterprise) to LLM clients, built on python-github-plus."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Avi Zaguri" }]
keywords = ["mcp", "github", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.30,<2",
    "python-github-plus>=2.0.0,<3",
    "pydantic-settings>=2.13.1",
    "anyio>=4.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "python-base-toolkit>=1.1.2",
]

[project.scripts]
python-github-plus-mcp = "github_plus_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/aviz92/python-github-plus-mcp"
Repository = "https://github.com/aviz92/python-github-plus-mcp"
Issues = "https://github.com/aviz92/python-github-plus-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["github_plus_mcp"]
